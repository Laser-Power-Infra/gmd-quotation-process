name: Build and Deploy

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master
    paths:
      - "apps/**"
      - "Dockerfile"
      - ".dockerignore"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/**"

# 🟢 ADD THESE 3 LINES:
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false


permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.app }}
    strategy:
      matrix:
        include:
          - app: gmd-quotation-process
            image: gmd-quotation-process
          # Distinct package name so GHCR links it to THIS repo on first push.
          - app: gmd-tender-dashboard
            image: gmd-quotation-process-tender-dashboard
    # Only the org repo deploys; forks skip both jobs (deploy needs this one).
    if: github.repository_owner == 'laser-power-infra'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      owner_lowercase: ${{ steps.repo_owner.outputs.owner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Short Commit SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Convert Repo Owner to Lowercase (GHCR requirement)
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: APP=${{ matrix.app }}
          push: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.image }}:${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: self-hosted
    steps:
        # 🟢 Step 1: Checkout the latest repo code on the server runner
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      # 🟢 Step 2: Copy the latest docker-compose.yml to D://
      - name: Sync Latest docker-compose.yml
        shell: powershell
        run: |
          Copy-Item -Path "docker-compose.yml" -Destination "D:/gmd-quotation-process/docker-compose.yml" -Force
          Write-Host "✅ Synced latest docker-compose.yml to D:/gmd-quotation-process/"

      - name: Pull and Restart Container
        shell: powershell
        working-directory: D:/stock-physical
        env:
          APP_VERSION: ${{ needs.build-and-push.outputs.short_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:APP_VERSION = $env:APP_VERSION

          
          docker compose pull gmd-quotation-process gmd-tender-dashboard
          docker compose up -d --no-deps gmd-quotation-process gmd-tender-dashboard

         
          $repo = "ghcr.io/laser-power-infra/stock-physical"
          $allImages = docker images --filter "reference=$repo" --format "{{.ID}}" | Select-Object -Unique
          $oldImages = $allImages | Select-Object -Skip 2

          if ($oldImages) {
              Write-Host "Cleaning up old images: $oldImages"
              $oldImages | ForEach-Object { docker rmi -f $_ }
          } else {
              Write-Host "No old images to prune. Latest and previous images preserved."
          }

         
          docker image prune -f
