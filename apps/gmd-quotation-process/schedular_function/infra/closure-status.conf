; Closure Status sync — docket_quotation_threads -> enquiries.closureStatus.
; Runs every 10m. Endpoint: app/api/scheduler/closure-status/route.ts (logic in
; schedular_function/run-closure-status.ts).
;
; Moved off the dashboard render, where the full thread scan caused 503s.
; `@every 10m` counts from when ofelia starts, not wall-clock. Each write is
; guarded on the value read, so overlap with docket-creation is harmless.
;
; job-local runs inside the ofelia container; -T 600 in the script matches the
; route's `maxDuration`.
[job-local "closure-status-sync"]
schedule = @every 10m
command = sh /scripts/api/closure-status-sync.sh
no-overlap = true
