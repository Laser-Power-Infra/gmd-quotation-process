; Supply History hourly MASTER sync — MASTER sheet -> SupplyHistoryItem.
; Endpoint: app/api/scheduler/supply-history/route.ts (logic in schedular_function/).
;
; Scheduled at :15 — between raw-material (:00) and contract-review (:30). This is
; the heaviest hourly job: it full-table-reads SupplyHistoryItem and stamps
; syncedAt on nearly every row, so it needs its own minute to avoid contending
; with the other two.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
[job-local "supply-history-sync"]
schedule = 0 15 * * * *
command = sh /scripts/api/supply-history-sync.sh
no-overlap = true