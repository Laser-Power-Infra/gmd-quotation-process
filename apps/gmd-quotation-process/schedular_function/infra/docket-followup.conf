; Docket follow-up detection + AI verification. Runs hourly at :10, before
; docket-creation (:20), so freshly flagged pendingDocket rows are ready.
; Endpoint: app/api/scheduler/docket-followup/route.ts (logic in schedular_function/).
;
; Detects new GMD-client mail forwarded to Laser Entry with docket-related
; context, sets pendingDocket = true, then verifies it with AI (one-by-one,
; max 3 attempts). true/false is final and never re-run.
;
; 48h lookback covers ingestion lag without touching older backlog.
; no-overlap + the app's in-flight latch prevent stacked scans.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
[job-local "docket-followup-sync"]
schedule = 0 10 * * * *
command = sh /scripts/api/docket-followup-sync.sh
no-overlap = true
