; Docket auto-link nightly: live contracts -> Enquiry.selectedContractNo (the Quotations page Contract column).
; Endpoint: app/api/scheduler/docket-auto-link/route.ts (logic in schedular_function/docket-auto-link.ts).
;
; 01:40 daily: links a contract only on a unique full match (every item code and qty).
; It writes the link only, never quoted rates; ambiguous and partial matches stay with
; the Match button. 01:40 starts after the hourly contract-review run (:30) and is free
; of execution-tracking, whose :40 slot is on even hours only.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow (container timezone).
; job-local runs inside the ofelia container; -T 600 in the script matches the
; route's `maxDuration`.
[job-local "docket-auto-link-sync"]
schedule = 0 40 1 * * *
command = sh /scripts/api/docket-auto-link-sync.sh
no-overlap = true
