; Sync health alert, daily: mails the jobs with no successful run in 24 h (STALE) or none
; at all (NEVER) to SYNC_ALERT_TO. No mail when SYNC_ALERT_TO is unset or nothing is stale.
; Endpoint: app/api/scheduler/sync-health/route.ts (logic in schedular_function/sync-health.ts).
;
; 10:00 IST, after every daily job (the last is pbg-reminders at 09:00), so a healthy
; daily job is always under 24 h old here and one that failed today is ~32 h old.
;
; 10:00 IST assumes the Ofelia container runs with TZ=Asia/Kolkata (see infra/README.md).
; If the container runs on UTC, replace the schedule with:
;   schedule = 0 30 4 * * *
;
; Light: one read of the job:* heartbeat rows and at most one mail.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow (container timezone).
; job-local runs inside the ofelia container; -T 600 in the script matches the
; route's `maxDuration`.
[job-local "sync-health"]
schedule = 0 0 10 * * *
command = sh /scripts/api/sync-health.sh
no-overlap = true
