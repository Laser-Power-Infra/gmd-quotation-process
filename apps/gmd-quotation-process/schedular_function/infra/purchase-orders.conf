; Purchase orders + GRN daily refresh: PURCHASE ORD AND GRN -> PurchaseOrderLine, GRN -> GrnLine (stock DB).
; Endpoint: app/api/scheduler/purchase-orders/route.ts (logic in schedular_function/purchase-orders.ts).
;
; 02:05 daily: after the 01:55 ledger job, before the working day, so the Purchase
; dashboard opens on that morning's orders and receipts. Nothing else writes
; either table, so the slot only has to avoid the heavy hourly block.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow (container timezone).
[job-local "purchase-orders-sync"]
schedule = 0 5 2 * * *
command = sh /scripts/api/purchase-orders-sync.sh
no-overlap = true
