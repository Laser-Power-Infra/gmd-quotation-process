; Ledger daily refresh: DEBTORS + CREDITORS + ADVANCE TO CREDITORS -> Debtor / Creditor / CreditorAdvance.
; Endpoint: app/api/scheduler/ledger/route.ts (logic in schedular_function/ledger-sync.ts).
;
; 01:55 daily: after the hourly block, before the working day, so the dashboards
; open on that morning's ledger. Snapshot copy: each table is replaced in its own
; transaction, so a renamed tab or column leaves that table as it was.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow (container timezone).
; job-local runs inside the ofelia container; -T 600 in the script is well inside
; the route's maxDuration.
[job-local "ledger-sync"]
schedule = 0 55 1 * * *
command = sh /scripts/api/ledger-sync.sh
no-overlap = true
