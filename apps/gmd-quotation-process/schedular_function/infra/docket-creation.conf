; Pending docket creation — recent DocketQuotationThread rows with
; pendingDocket = true -> Enquiry (today plus 5 days of backlog).
; Endpoint: app/api/scheduler/docket-creation/route.ts (logic in schedular_function/).
;
; Creates a header-only Enquiry with an auto-generated docket number, links the
; mail attachments, generates the snapshot PDF, and stamps the thread with the
; new docket number + clears pendingDocket. The same run then runs the
; pending-docket dedupe: duplicate zero-item dockets for a mail that already has
; a docket are deleted and the thread is folded with duplicateOfDocket.
;
; Scope: today plus the previous 5 IST days (the ingestion can lag), and one
; docket per mail. The thread stamp is not durable — the external mail ingestion
; re-syncs the row and clears docketNo back to NULL within the hour — so the
; guard that holds is Enquiry.sourceThreadId: a candidate whose mail already has
; a docket is skipped.
;
; Scheduled at :20, between supply-history (:15) and contract-review (:30), so
; contract-review's same-hour pass can backfill contractNo on the new dockets.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 900 in the script is well inside
; the route's maxDuration.
[job-local "docket-creation-sync"]
schedule = 0 20 * * * *
command = sh /scripts/api/docket-creation-sync.sh
no-overlap = true
