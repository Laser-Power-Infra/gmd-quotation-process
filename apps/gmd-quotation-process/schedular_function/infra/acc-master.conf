; ACC Master hourly refresh — ACC_MASTER tab -> acc_master (consignee code -> name).
; Endpoint: app/api/scheduler/acc-master/route.ts (logic in schedular_function/).
;
; Scheduled at :35, after the heavy jobs and immediately before
; execution-tracking (:40), the job that joins on this table. The
; execution-tracking step refreshes acc_master too, so a missed :35 run delays
; nothing badly — this entry is what keeps the list fresh for every other caller.
;
; Keep-based: rows the sheet no longer carries are left in place, and a blank
; ACC_NAME never clears a stored name, so a bad run cannot destroy data.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 600 in the script is well inside
; the route's maxDuration.
[job-local "acc-master-sync"]
schedule = 0 35 * * * *
command = sh /scripts/api/acc-master-sync.sh
no-overlap = true
