; Service / Work Orders daily refresh: ITEM MASTER ERP -> ServiceItem.
; PO and GRN lines come from the purchase-orders job (stock DB PurchaseOrderLine / GrnLine).
; Endpoint: app/api/scheduler/service-orders/route.ts (logic in schedular_function/service-orders-sync.ts).
;
; 02:10 daily: after the 02:05 purchase-orders run, before the working day. Snapshot
; copy in one transaction, so a renamed tab or column leaves the table as it was.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow (container timezone).
[job-local "service-orders-sync"]
schedule = 0 10 2 * * *
command = sh /scripts/api/service-orders-sync.sh
no-overlap = true
