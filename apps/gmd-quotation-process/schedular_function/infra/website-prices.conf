; Website price push - RawMaterial.cost -> /purchase catalogue prices on the GM Dalui website.
; Endpoint: app/api/scheduler/website-prices/route.ts (logic in schedular_function/website-prices.ts).
;
; Scheduled at :55, after the other hourly jobs, so costs edited on /raw_material
; during the hour reach the website within the hour.
; Read-only on this side: it reads RawMaterial and POSTs a full snapshot to the
; website, which prices matched items and marks the rest "Price on request".
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 300 in the script matches the
; route's maxDuration.
[job-local "website-prices-sync"]
schedule = 0 55 * * * *
command = sh /scripts/api/website-prices-sync.sh
no-overlap = true
