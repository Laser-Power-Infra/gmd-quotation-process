; ERP Contract No sync (every 2 hours) — MC.CONTRACT_VRNO -> SupplyHistoryItem.erpContractNo.
; Endpoint: app/api/scheduler/erp-contract-no/route.ts (logic in schedular_function/).
;
; Each run lands at :50 of an even hour, after execution-tracking (:40) has
; written the SupplyHistoryItem rows for a new invoice in the same hour, so a
; brand-new invoice gets its contract number in the same 2-hourly pass.
;
; The join is SALE BILL.ORDER_VRNO = MC.VRNO -> MC.CONTRACT_VRNO, applied to
; every row of the matched invoice. Current fiscal year only (April start). A
; one-off year is run from the CLI: `npm run contractno:sync -- --fy <year>`.
;
; Blank MC cells never clear a stored value; MC wins when it carries a different
; value. The `supply-history` job also writes this column from MASTER, so watch
; overwrittenRows: a rising count is a sign the two sources disagree.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 600 in the script is well inside
; the route's maxDuration.
[job-local "erp-contract-no-sync"]
schedule = 0 50 */2 * * *
command = sh /scripts/api/erp-contract-no-sync.sh
no-overlap = true
