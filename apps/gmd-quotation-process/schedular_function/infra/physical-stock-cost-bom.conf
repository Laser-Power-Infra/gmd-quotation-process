; Physical Stock cost / BOM ID hourly derivation.
; Endpoint: app/api/scheduler/physical-stock-cost-bom/route.ts (logic in
; schedular_function/run-physical-stock-cost-bom.ts).
;
; Recomputes cost / bom_id / majorminor_marking by reading the local BOM graph
; (FullItem / Bom / BomItem) and RawMaterial.majorMarking, and writing the
; result to the stock DB PhysicalStock table.
;
; Scheduled at :10 — after bom-mast (:05), whose BOM graph this step reads, and
; before supply-history (:15). It writes only the stock DB, so it contends with no other
; job for the local database.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 1800 in the script matches the
; route's `maxDuration`.
; no-overlap stops one slow run from stacking behind the next.
[job-local "physical-stock-cost-bom-sync"]
schedule = 0 10 * * * *
command = sh /scripts/api/physical-stock-cost-bom-sync.sh
no-overlap = true
