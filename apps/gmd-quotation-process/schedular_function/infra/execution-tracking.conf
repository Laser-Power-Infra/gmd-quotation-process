; Execution Tracking sync (every 2 hours) — SALE_BILL tab -> SupplyHistoryItem.
; Endpoint: app/api/scheduler/execution-tracking/route.ts (logic in schedular_function/).
;
; Each run still lands at :40 of an even hour, after acc-master (:35) in that
; same hour has refreshed the code -> name list and after supply-history (:15)
; wrote the MASTER rows this job patches. Running last means the SALE_BILL values
; win for the day, which is the intent: it is the execution record.
;
; Current fiscal year only (April start). A one-off year is run from the
; /supply_history dropdown button or `npm run exec:sync -- --fy <year>`.
;
; Blank sheet cells never clear a stored value, `state` is written only when the
; sheet value is a recognised Indian state, and a row whose invoice maps to
; several DB rows that ITEM_CODE cannot split is skipped and counted rather than
; overwritten. Nothing is ever deleted.
;
; ofelia uses a 6-field cron: sec min hour dom mon dow.
; job-local runs inside the ofelia container; -T 600 in the script is well inside
; the route's maxDuration.
[job-local "execution-tracking-sync"]
schedule = 0 40 */2 * * *
command = sh /scripts/api/execution-tracking-sync.sh
no-overlap = true
