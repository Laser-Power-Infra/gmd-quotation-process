; Daily PBG reminder emails.
;
; 09:00 IST assumes the Ofelia container runs with TZ=Asia/Kolkata.
; If the container runs on UTC, replace the schedule with:
;   schedule = 30 3 * * *
;
; The command path must match where infra/pbg-reminders.sh is mounted
; inside the Ofelia container (example: ./infra:/infra:ro).
[job-local pbg-reminders]
schedule = 0 9 * * *
command = /bin/sh /infra/pbg-reminders.sh
