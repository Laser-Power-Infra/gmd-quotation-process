# Both apps. Images are built from the root Dockerfile (--build-arg APP=<app>)
# and pushed by .github/workflows/deploy.yml. Each server.js runs from its app
# folder (/app/apps/<app>), so runtime files are mounted there.
services:
  gmd-quotation-process:
    image: ghcr.io/laser-power-infra/gmd-quotation-process:${APP_VERSION:-latest}
    container_name: gmd-quotation-process
    ports:
      - "4570:4570"
    env_file: 
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4570
      HOSTNAME: 0.0.0.0
      GOOGLE_APPLICATION_CREDENTIALS: /app/apps/gmd-quotation-process/credentials.json
      TOKEN_PATH: /app/apps/gmd-quotation-process/token.json
    volumes:
      - ./credentials.json:/app/apps/gmd-quotation-process/credentials.json:ro
      - ./token.json:/app/apps/gmd-quotation-process/token.json:rw
    restart: unless-stopped
    networks:
      - infra

  gmd-tender-dashboard:
    image: ghcr.io/laser-power-infra/gmd-quotation-process-tender-dashboard:${APP_VERSION:-latest}
    container_name: gmd-tender-dashboard
    ports:
      - "4126:4126"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4126
      HOSTNAME: 0.0.0.0
      CONDUTOR_PATH: /mnt/condutor/Tenders-bd/Condutor
      INDEXER_NETWORK_PATH: /mnt/indexer/COSTING & INVOLVEMENT
      SUPPLY_NETWORK_PATH: /mnt/supply
      COSTING_FILE_NETWORK_HOST_PATH: /mnt/costing/COSTING & INVOLVEMENT
      OLD_RA_EXCEL_PATH: /mnt/old-files/TENDER 2023-2024
      OLD_FILES: /mnt/old-files/TENDER 2023-2024
      TYPE_TEST_FILES_PATH: /mnt/condutor/Updated TTR
    volumes:
      - condutor:/mnt/condutor
      - indexer:/mnt/indexer
      - supply:/mnt/supply
      - costing:/mnt/costing
      - old-files:/mnt/old-files
      - ./credentials.json:/app/apps/gmd-tender-dashboard/credentials.json:ro
      - ./token.json:/app/apps/gmd-tender-dashboard/token.json:rw
    restart: unless-stopped
    networks:
      - infra

volumes:
  condutor:
    external: true
    name: infrastructure_condutor
  indexer:
    external: true
    name: infrastructure_indexer
  supply:
    external: true
    name: infrastructure_supply
  costing:
    external: true
    name: infrastructure_costing
  old-files:
    external: true
    name: infrastructure_old-files

networks:
  infra:
    external: true
